<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pertamaku</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }
        .kotak {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            margin: auto;
        }
        h1 {
            color: #38bdf8;
        }
        button {
            background: #38bdf8;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="kotak">
        <h1>Selamat Datang!</h1>
        <p>Ini adalah website pertamaku.</p>
        <p>Dibuat langsung melalui HP Android.</p>
        <button onclick="alert('Halo! Website berhasil dibuat!')">
            Klik Saya
        </button>
    </div>
</body>
</html>
